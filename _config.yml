title: Tae-Hyoung Choi
description: Catholic music, liturgy, and computer science notes
url: https://selmo.github.io

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Use our custom layout for every page
defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - _archive/
  - refs/
  - cards/
  - scripts/
  - GEMINI.md
  - "*.xlsx"
  - "*.xls"
  - README.md
  - resources/Journeysongs-3ed.pdf
  - .DS_Store
  - "**/.DS_Store"

# Plugins available on GitHub Pages
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
# jekyll-sitemap 은 사용하지 않는다.
# 플러그인이 defaults 의 static_files sitemap:false 를 무시해 악보 PDF가 색인되었다.
# 대신 루트의 sitemap.xml 템플릿에서 HTML 페이지만 직접 담는다.

# Process .md links as if they were rendered HTML links
relative_links:
  enabled: true
  collections: false
