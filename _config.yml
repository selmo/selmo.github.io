title: Tae-Hyoung Choi
description: Catholic music, liturgy, and computer science notes
url: https://selmo.github.io

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Use our custom layout for every page
defaults:
  - scope:
      path: ""
    values:
      layout: default
  # 다운로드 악보 PDF는 검색 색인(sitemap)에서 제외
  - scope:
      path: "resources/OnE-Scores"
      type: static_files
    values:
      sitemap: false

exclude:
  - _archive/
  - refs/
  - cards/
  - GEMINI.md
  - "*.xlsx"
  - "*.xls"
  - README.md
  - resources/Journeysongs-3ed.pdf
  - .DS_Store
  - "**/.DS_Store"

# Plugins available on GitHub Pages
plugins:
  - jekyll-relative-links
  - jekyll-sitemap
  - jekyll-seo-tag

# Process .md links as if they were rendered HTML links
relative_links:
  enabled: true
  collections: false
