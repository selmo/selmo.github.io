# 곡 메타데이터 — ccm/songs/ 개별 페이지 인덱스용
#
# Schema:
#   - file:          ccm/songs/<file>.md (확장자 제외)
#     title_ko:       한국어 제목
#     title_en:       원곡(영문) 제목
#     composer:       작곡가
#     yahure_number:  야훼이레(3판) 번호 (없으면 null)
#     type:           translation | adaptation | original
#     artist_file:    ccm/artists/<file>.md (없으면 null)
#     copyright:      저작권 (선택)
#
# 분류:
#   translation : 번역곡 (원곡 작곡가 있음)
#   adaptation  : 번안곡 (원곡을 새 가사로 번안)
#   original    : 창작곡 (원곡 없는 자작)

